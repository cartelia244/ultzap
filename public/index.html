<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ULTZAP</title>
    <link rel="stylesheet" href="style.css">
    <meta name="theme-color" content="#008069">
</head>
<body>
    <!-- Tela de Cadastro -->
    <div id="setup-screen" class="screen">
        <div class="setup-container">
            <h1>Dados do Perfil</h1>
            <p>Insira seu nome e uma foto de perfil opcional</p>
            <div class="photo-upload" onclick="document.getElementById('photo-input').click()">
                <img id="preview-photo" src="https://via.placeholder.com/150?text=+" alt="Perfil">
                <div class="camera-icon">📷</div>
            </div>
            <input type="file" id="photo-input" accept="image/*" class="hidden" onchange="previewImage(this)">
            <input type="text" id="name-input" placeholder="Digite seu nome">
            <button class="btn-next" onclick="register()">AVANÇAR</button>
        </div>
    </div>

    <!-- Tela Principal -->
    <div id="main-screen" class="screen hidden">
        <header>
            <div class="header-top">
                <span class="logo">ULTZAP</span>
                <div class="header-icons">
                    <button>🔍</button>
                    <button onclick="toggleSettings()">⋮</button>
                </div>
            </div>
            <div class="tabs">
                <div class="tab active" onclick="switchTab('chats')">Conversas</div>
                <div class="tab" onclick="switchTab('status')">Status</div>
                <div class="tab" onclick="switchTab('calls')">Chamadas</div>
            </div>
        </header>

        <div id="chats" class="tab-pane">
            <div id="chat-list"></div>
            <button class="fab" onclick="addContact()">💬</button>
        </div>

        <div id="status" class="tab-pane hidden">
            <div class="empty-state">Nenhum status disponível</div>
        </div>

        <div id="calls" class="tab-pane hidden">
            <div class="empty-state">Nenhuma chamada recente</div>
        </div>
    </div>

    <!-- Janela de Chat -->
    <div id="chat-window" class="screen hidden">
        <div class="chat-header">
            <button class="back-btn" onclick="backToList()">←</button>
            <img id="contact-photo" src="" alt="">
            <span id="contact-name" style="flex: 1; font-weight: bold;"></span>
            <div class="header-icons">
                <button>📹</button>
                <button>📞</button>
            </div>
        </div>
        <div id="messages" class="messages-area"></div>
        <div class="input-area">
            <button class="icon-btn" onclick="document.getElementById('media-input').click()">📎</button>
            <input type="file" id="media-input" hidden accept="image/*,video/*" onchange="sendMedia(this)">
            <input type="text" id="msg-input" placeholder="Mensagem">
            <button class="icon-btn" id="audio-btn" onmousedown="startRecording()" onmouseup="stopRecording()" ontouchstart="startRecording()" ontouchend="stopRecording()">🎤</button>
            <button class="send-btn" onclick="sendMessage()">➤</button>
        </div>
    </div>

    <!-- Tela de Configurações -->
    <div id="settings-screen" class="screen hidden">
        <div class="settings-header">
            <button class="back-btn" onclick="toggleSettings()">←</button>
            <span>Configurações</span>
        </div>
        <div class="settings-content">
            <div class="profile-card" onclick="editBio()">
                <img id="settings-photo" src="" alt="">
                <div>
                    <h2 id="settings-name"></h2>
                    <p id="settings-bio">Disponível</p>
                </div>
            </div>
            <div class="setting-item">
                <span class="icon">📱</span>
                <div>
                    <strong>Número do ULTZAP</strong>
                    <p id="settings-number"></p>
                </div>
            </div>
            <div class="setting-item" onclick="editBio()">
                <span class="icon">ℹ️</span>
                <div>
                    <strong>Recado</strong>
                    <p id="settings-bio-detail">Disponível</p>
                </div>
            </div>
            <div class="setting-item logout-item" onclick="logout()">
                <span class="icon">🚪</span>
                <div>
                    <strong>Sair da conta</strong>
                    <p style="color: #d91e1e;">Desconectar deste dispositivo</p>
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
